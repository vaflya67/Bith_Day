<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Не забывай поздравить с днём рождения">
  <meta name="theme-color" content="#0a0812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ДР · не забудь</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Theme: styles.css (pink+gold). Backups: styles.violet.css | styles.gold.css -->
</head>
<body>
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="app" id="mainView">
    <header class="header">
      <div class="header-top">
        <h1 class="logo">ДР<span class="logo-icon">🎂</span></h1>
        <div class="header-actions">
          <button class="icon-btn" id="btnCatalog" type="button" title="Все люди" aria-label="Все люди">☰</button>
          <button class="icon-btn" id="btnExport" type="button" title="Экспорт" aria-label="Экспорт">↓</button>
        </div>
      </div>
      <p class="subtitle">Не забудь поздравить</p>
      <div class="next-bday" id="nextBdayWidget" hidden></div>
    </header>

    <div id="todayBlock" hidden></div>
    <div id="missedBlock" hidden></div>
    <div id="soonBlock" hidden></div>
    <div id="laterBlock" hidden></div>

    <p class="empty-state" id="emptyState" hidden>Добавь первого человека</p>

    <button class="add-person-btn" id="btnAddPerson" type="button">+ Добавить</button>
  </div>

  <div class="sub-page" id="addView" hidden>
    <header class="add-header">
      <button class="icon-btn" id="btnCloseAdd" type="button" aria-label="Назад">←</button>
      <h2 class="add-title">Новый человек</h2>
      <span class="add-header-spacer"></span>
    </header>

    <div class="field">
      <span class="field-label">Имя</span>
      <div class="name-preview" id="namePreview">Имя</div>
      <div class="case-toggle" id="caseToggle">
        <button type="button" class="case-btn case-btn--active" data-case="upper">Большие АБВ</button>
        <button type="button" class="case-btn" data-case="lower">Маленькие абв</button>
      </div>
      <div class="letter-pad" id="letterPad"></div>
    </div>

    <div class="field">
      <span class="field-label">День</span>
      <div class="day-display" id="dayDisplay">—</div>
      <div class="numpad" id="dayNumpad"></div>
    </div>

    <div class="field">
      <span class="field-label">Месяц</span>
      <div class="month-grid" id="monthGrid"></div>
    </div>

    <button class="submit-btn" id="btnSave" type="button">Сохранить</button>
  </div>

  <div class="sub-page" id="catalogView" hidden>
    <header class="add-header">
      <button class="icon-btn" id="btnCloseCatalog" type="button" aria-label="Назад">←</button>
      <h2 class="add-title">Все люди <span class="catalog-count" id="catalogCount"></span></h2>
      <button class="icon-btn icon-btn--accent" id="btnCatalogAdd" type="button" aria-label="Добавить">+</button>
    </header>

    <div class="field field--compact">
      <span class="field-label">Поиск</span>
      <div class="search-bar">
        <div class="search-preview is-empty" id="searchPreview">Поиск по имени…</div>
        <button class="search-clear" id="btnClearSearch" type="button" hidden aria-label="Очистить">×</button>
      </div>
      <div class="search-pad" id="searchPad"></div>
    </div>

    <div class="catalog-list" id="catalogList"></div>
    <p class="empty-state" id="catalogEmpty" hidden>Никого не найдено</p>

    <button class="add-person-btn" id="btnCatalogAddBottom" type="button">+ Добавить</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
